spring.application.name=Api-rest-aviles

# Activar el perfil correspondiente (sql o nosql) si usaste @Profile en tus adaptadores
spring.profiles.active=sql

# ===============================
# PostgreSQL
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/panfrances
spring.datasource.username=admin
spring.datasource.password=admin    
# CORREGIDO: Era org.postgresql.Driver (sin el número 2)
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.data-source-properties.stringtype=unspecified

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update


#===============================
# MongoDB
#===============================
spring.data.mongodb.uri=mongodb://admin:admin@localhost:27017/nopanfrances?authSource=admin